name: Build rk3399-wf7000 DTB

# 触发方式：
#  1) push 修改 rk3399-wf7000.dts 或本 workflow 文件
#  2) 网页 Actions 页面手动 Run workflow
on:
  push:
    paths:
      - 'rk3399-wf7000.dts'
      - '.github/workflows/build-dtb.yml'
  workflow_dispatch:

# 发布 Release 需要写权限（新建仓库的默认 GITHUB_TOKEN 是只读）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc-aarch64-linux-gnu bison flex libssl-dev bc python3

      - name: Clone kernel (multi-mirror fallback)
        env:
          KERNEL_DIR: ${{ github.workspace }}/linux-6.1.y-rockchip
        run: |
          MIRRORS=(
            "https://github.com/unifreq/linux-6.1.y-rockchip"
            "https://ghproxy.com/https://github.com/unifreq/linux-6.1.y-rockchip"
            "https://gitclone.com/github.com/unifreq/linux-6.1.y-rockchip"
          )
          for repo in "${MIRRORS[@]}"; do
            echo "==> try: $repo"
            if git clone --depth 1 -b main "$repo" "$KERNEL_DIR" 2>/dev/null; then
              echo "==> cloned from $repo"
              break
            fi
            echo "==> failed, next ..."
          done
          [ -d "$KERNEL_DIR" ] || { echo "错误: 所有镜像克隆失败"; exit 1; }

      - name: Place dts and build dtb
        env:
          KERNEL_DIR: ${{ github.workspace }}/linux-6.1.y-rockchip
        run: |
          cp rk3399-wf7000.dts "$KERNEL_DIR/arch/arm64/boot/dts/rockchip/"
          cd "$KERNEL_DIR"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" rockchip/rk3399-wf7000.dtb
          cp arch/arm64/boot/dts/rockchip/rk3399-wf7000.dtb "$GITHUB_WORKSPACE/rk3399-wf7000.dtb"
          ls -l "$GITHUB_WORKSPACE/rk3399-wf7000.dtb"
          sha256sum "$GITHUB_WORKSPACE/rk3399-wf7000.dtb"

      - name: Upload DTB artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3399-wf7000-dtb
          path: ${{ github.workspace }}/linux-6.1.y-rockchip/arch/arm64/boot/dts/rockchip/rk3399-wf7000.dtb

      - name: Publish DTB to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dtb-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create dtb-latest rk3399-wf7000.dtb \
            --title "rk3399-wf7000.dtb ($(date -u '+%Y-%m-%d %H:%M UTC'))" \
            --notes "自动编译产物，来源 commit: ${{ github.sha }}"
          echo "==> https://github.com/${{ github.repository }}/releases/tag/dtb-latest"
